[project]
name = "arxiv-walker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.optional-dependencies]
clusters = ["scikit-learn>=1.5"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[project.scripts]
arxiv-walker = "arxiv_walker.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
